<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Code Quest – UI tests</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 16px; background: #fcf5f3; color: #2f2e47; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  #summary { font-weight: 800; margin: 8px 0 14px; }
  #summary.ok { color: #1b7f55; } #summary.bad { color: #b3372f; }
  #out { white-space: pre-wrap; background: #fff; border: 1px solid #d9d2df; border-radius: 10px; padding: 12px; }
  iframe { border: 2px solid #6f6a94; border-radius: 12px; background: #fff; height: 760px; display: block; margin-top: 14px; }
</style>
</head>
<body>
<h1>Young Engineers · Code Quest · UI tests</h1>
<p>Runs the real app inside the frame below and clicks through it. Open this page from a local web server
(see README) or any hosted copy of the project. Add <code>?w=375</code> to test a phone-width screen.</p>
<div id="summary">Running…</div>
<pre id="out"></pre>
<iframe id="app" title="Code Quest under test"></iframe>

<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var width = parseInt(params.get('w') || '1000', 10);
  var frameEl = document.getElementById('app');
  frameEl.style.width = width + 'px';
  var out = document.getElementById('out');
  var summary = document.getElementById('summary');
  var passed = 0, failed = 0, nonce = 0;

  function log(line) { out.textContent += line + '\n'; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }
  function eq(a, b, msg) { if (a !== b) throw new Error(msg + ' (expected ' + JSON.stringify(b) + ', got ' + JSON.stringify(a) + ')'); }

  function doc() { return frameEl.contentDocument; }
  function win() { return frameEl.contentWindow; }
  function $(sel) { return doc().querySelector(sel); }
  function $$(sel) { return Array.prototype.slice.call(doc().querySelectorAll(sel)); }
  function text(sel) { var e = $(sel); return e ? e.textContent.trim() : null; }

  function loadFrame() {
    return new Promise(function (resolve) {
      frameEl.onload = function () { frameEl.onload = null; resolve(); };
      frameEl.src = '../index.html?t=' + (++nonce);
    });
  }
  async function fresh() {
    await loadFrame();
    win().sessionStorage.clear();
    await loadFrame();
    win().confirm = function () { return true; };
  }
  async function reload() { await loadFrame(); win().confirm = function () { return true; }; }

  function setName(v) {
    var i = $('#student-name');
    i.value = v;
    var EventCtor = win().Event;
    i.dispatchEvent(new EventCtor('input', { bubbles: true }));
  }
  function submitName(v) {
    setName(v);
    $('.name-card button[type=submit]').click();
  }
  async function startAs(name) { await fresh(); submitName(name); }

  function currentQuestion() {
    var prompt = text('#q-prompt');
    var codeEl = $('pre.code');
    var code = codeEl ? codeEl.textContent : '';
    var all = win().CodeQuestData.QUESTIONS;
    var q = all.filter(function (x) { return x.prompt === prompt && (x.code || '') === code; })[0];
    assert(q, 'Could not match on-screen question: ' + prompt);
    return q;
  }
  function pick(i) { var b = $('.opt[data-index="' + i + '"]'); assert(b && !b.disabled, 'option ' + i + ' not clickable'); b.click(); }
  function check() { var b = $('.actions .btn'); assert(b.textContent.indexOf('Check Answer') === 0, 'Check button missing: ' + b.textContent); b.click(); }
  function wrongs(q) { return [0, 1, 2, 3].filter(function (i) { return i !== q.answer; }); }
  function next() { $('.actions .btn').click(); }
  function noHorizontalScroll(label) {
    var d = doc().documentElement;
    assert(d.scrollWidth <= d.clientWidth + 1, 'Horizontal scrolling on ' + label + ' (' + d.scrollWidth + ' > ' + d.clientWidth + ')');
  }

  // Answer the current question correctly (first try)
  function solve() { var q = currentQuestion(); pick(q.answer); check(); return q; }
  // Fail the current question 3 times to force a reveal
  function fail() { var q = currentQuestion(); wrongs(q).forEach(function (i) { pick(i); check(); }); return q; }

  // Play one page: n correct then the rest revealed
  function playPage(n) {
    for (var i = 0; i < 4; i++) {
      if (i < n) solve(); else fail();
      assert($('.actions .btn').textContent.indexOf(i === 3 ? 'See My Score' : 'Next Question') === 0, 'wrong next button label on q' + (i + 1));
      next();
    }
  }

  var tests = [];
  function test(name, fn) { tests.push({ name: name, fn: fn }); }

  /* ───────────── tests ───────────── */
  test('welcome screen shows the required wording and no top bar', async function () {
    await fresh();
    assert(/WELCOME,\s*YOUNG ENGINEER!\s*🚀/.test(text('h1')), 'heading: ' + text('h1'));
    eq(text('.welcome__lead'), "Every great engineer starts with curiosity. Today, we're testing yours!", 'lead');
    eq(text('.name-card label'), "What's your name, Engineer?", 'prompt');
    eq(text('.name-card button'), "LET'S GO! 🚀", 'button');
    eq(text('.welcome__tag'), 'Think smart. Try again. Never stop learning.', 'tagline');
    eq($('#topbar').hidden, true, 'top bar hidden on welcome');
    assert($('.welcome__scene svg'), 'illustrations present');
    noHorizontalScroll('welcome');
  });

  test('student cannot start without a valid name', async function () {
    await fresh();
    ['', '   ', 'A', '<b>hi</b>', '12345', '=SUM(A1)'].forEach(function (bad) {
      submitName(bad);
      eq(win().document.body.getAttribute('data-view'), 'welcome', 'should stay on welcome for "' + bad + '"');
      assert(text('#name-error').length > 0, 'error message for "' + bad + '"');
      eq($('#student-name').getAttribute('aria-invalid'), 'true', 'aria-invalid for "' + bad + '"');
    });
    setName('Wanjiru');
    eq(text('#name-error'), '', 'error clears when typing');
  });

  test('a valid name starts the quiz and appears in the top bar', async function () {
    await startAs('  Wanjiru   Kamau ');
    eq(win().document.body.getAttribute('data-view'), 'quiz', 'view');
    assert(text('.chip-name').indexOf('Wanjiru Kamau') !== -1, 'name chip: ' + text('.chip-name'));
    assert(text('.page-head__title').indexOf('Page 1: Introduction to Programming') !== -1, 'page title');
    eq(text('.qcount'), 'Question 1 of 4', 'counter');
    eq($$('.opt').length, 4, 'four options');
    eq($$('.steps .step').length, 4, 'four progress steps');
    noHorizontalScroll('question');
  });

  test('Check Answer is disabled until an option is selected; selection shows clearly', async function () {
    await startAs('Test Kid');
    eq($('.actions .btn').disabled, true, 'check disabled initially');
    pick(2);
    eq($('.actions .btn').disabled, false, 'check enabled after selecting');
    assert($('.opt.is-selected'), 'selected state');
    eq($('.opt.is-selected').getAttribute('data-index'), '2', 'selected index');
    pick(1);
    eq($$('.opt.is-selected').length, 1, 'only one selected at a time');
    eq($('.opt.is-selected').getAttribute('data-index'), '1', 'selection moved');
  });

  test('wrong attempt 1: exact message, hint, option struck out, still open', async function () {
    await startAs('Test Kid');
    var q = currentQuestion();
    var w = wrongs(q);
    pick(w[0]); check();
    eq(text('.fb__msg'), 'Not quite! Give it another try. 💡', 'message');
    assert(text('.fb').indexOf(q.hints[0]) !== -1, 'hint 1 shown');
    assert(text('.fb').indexOf(q.options[q.answer]) === -1, 'answer not revealed');
    assert($('.opt[data-index="' + w[0] + '"]').classList.contains('is-tried'), 'tried style');
    eq($('.opt[data-index="' + w[0] + '"]').disabled, true, 'tried option disabled');
    eq(text('.tries > span:last-child'), 'Try 2 of 3', 'tries label');
    assert($('.actions .btn').textContent.indexOf('Check Answer') === 0, 'still checking');
  });

  test('wrong attempt 2: exact message and a different hint', async function () {
    await startAs('Test Kid');
    var q = currentQuestion(), w = wrongs(q);
    pick(w[0]); check(); pick(w[1]); check();
    eq(text('.fb__msg'), "Almost there! Think carefully. You've got this!", 'message');
    assert(text('.fb').indexOf(q.hints[1]) !== -1, 'hint 2 shown');
    assert(text('.fb').indexOf(q.hints[0]) === -1, 'hint 1 replaced');
    eq(text('.tries > span:last-child'), 'Try 3 of 3', 'tries label');
  });

  test('wrong attempt 3: answer + explanation + why-wrong revealed, locked, no point', async function () {
    await startAs('Test Kid');
    var q = currentQuestion(), w = wrongs(q);
    w.forEach(function (i) { pick(i); check(); });
    var fb = text('.fb');
    assert(fb.indexOf('The correct answer is') !== -1, 'answer line');
    assert(fb.indexOf(q.options[q.answer]) !== -1, 'correct answer text shown');
    assert(fb.indexOf(q.explanation) !== -1, 'explanation shown');
    assert(fb.indexOf(q.whyWrong[w[2]]) !== -1, 'why-wrong for the last pick shown');
    assert($('.opt[data-index="' + q.answer + '"]').classList.contains('is-correct'), 'correct option highlighted');
    eq($$('.opt:not(:disabled)').length, 0, 'all options locked');
    eq(text('.tries > span:last-child'), 'No tries left', 'tries label');
    next();
    // go to the end of page 1 and confirm that revealed answer earned nothing
    for (var i = 1; i < 4; i++) { solve(); next(); }
    eq(text('.ring__num .count'), '0', 'initial count text'); // count-up starts at 0 (animated)
    eq($('.ring').getAttribute('aria-label'), 'Score: 3 out of 4', 'revealed answer earned no point');
  });

  test('correct answer: exact message, explanation, locked, cannot score twice', async function () {
    await startAs('Test Kid');
    var q = solve();
    eq(text('.fb__msg'), 'CORRECT! WELL DONE! ✅', 'message');
    assert(text('.fb').indexOf(q.explanation) !== -1, 'explanation');
    eq($$('.opt:not(:disabled)').length, 0, 'options locked');
    eq(text('.tries > span:last-child'), 'Solved on your first try!', 'tries label');
    $$('.opt').forEach(function (b) { b.click(); }); // clicking locked options does nothing
    eq($$('.opt:not(:disabled)').length, 0, 'still locked after clicks');
    assert($('.opt.is-correct'), 'correct highlighted');
    eq(text('.qcount'), 'Question 1 of 4', 'did not advance by itself');
    // finish page with the remaining three and verify score of exactly 4
    next(); solve(); next(); solve(); next(); solve(); next();
    eq($('.ring').getAttribute('aria-label'), 'Score: 4 out of 4', 'exactly 4/4 (no double scoring)');
  });

  test('correct on a later attempt still gives the point and shows the try number', async function () {
    await startAs('Test Kid');
    var q = currentQuestion();
    pick(wrongs(q)[0]); check();
    pick(q.answer); check();
    eq(text('.fb__msg'), 'CORRECT! WELL DONE! ✅', 'message');
    eq(text('.tries > span:last-child'), 'Solved on try 2 of 3', 'tries label');
  });

  test('attempt counter is independent for each question', async function () {
    await startAs('Test Kid');
    var q = currentQuestion();
    pick(wrongs(q)[0]); check(); pick(wrongs(q)[1]); check();
    pick(q.answer); check(); next();
    eq(text('.tries > span:last-child'), 'Try 1 of 3', 'second question starts fresh');
    var q2 = currentQuestion();
    pick(wrongs(q2)[0]); check();
    eq(text('.fb__msg'), 'Not quite! Give it another try. 💡', 'second question gets attempt-1 message');
  });

  test('page result screens: perfect score has the right message, confetti and Continue', async function () {
    await startAs('Test Kid');
    playPage(4);
    eq(win().document.body.getAttribute('data-view'), 'pageResult', 'view');
    eq(text('#result-title'), 'YEAHHH!! PERFECT SCORE! 🥳', 'headline');
    eq($('.ring').getAttribute('aria-label'), 'Score: 4 out of 4', 'score');
    await sleep(300);
    assert($$('#confetti i').length > 20, 'confetti launched');
    assert($('.launch'), 'rocket launch for perfect score');
    await sleep(1300);
    eq(text('.ring__num .count'), '4', 'count-up reached 4');
    eq($$('.recap li').length, 4, 'recap rows');
    assert(text('.result > .btn').indexOf('Continue to Page 2: Computer Software Roadmap') === 0, 'continue label: ' + text('.result > .btn'));
    noHorizontalScroll('page result');
  });

  test('every score level shows its own headline (4, 3, 2, 1, 0)', async function () {
    var expect = {
      4: 'YEAHHH!! PERFECT SCORE! 🥳',
      3: "Amazing work! You're getting there!",
      2: 'Good effort! Keep learning.',
      1: "Don't give up. Every great programmer makes mistakes!",
      0: "Don't give up. Every great programmer makes mistakes!"
    };
    for (var n = 0; n <= 4; n++) {
      await startAs('Test Kid');
      playPage(n);
      eq(text('#result-title'), expect[n], 'headline for ' + n + '/4');
      eq($('.ring').getAttribute('aria-label'), 'Score: ' + n + ' out of 4', 'score for ' + n);
      eq($$('.recap__tag--good').length, n, 'recap good tags for ' + n);
      eq($$('.recap__tag--learn').length, 4 - n, 'recap review tags for ' + n);
    }
  });

  test('celebration level scales with score (none for low scores)', async function () {
    // Each correct answer fires a small 16-piece burst; the page-level celebration comes on top.
    await startAs('Test Kid'); playPage(1); await sleep(400);
    assert($$('#confetti i').length <= 16, 'only the single answer burst for 1/4, got ' + $$('#confetti i').length);
    assert(!$('.launch'), 'no rocket for 1/4');
    await startAs('Test Kid'); playPage(3); await sleep(400);
    assert($$('#confetti i').length > 60, 'page confetti on top of answer bursts for 3/4, got ' + $$('#confetti i').length);
    assert(!$('.launch'), 'no rocket for 3/4');
    await startAs('Test Kid'); playPage(4); await sleep(400);
    assert($('.launch'), 'rocket launch for 4/4');
  });

  test('full perfect run through all 4 pages → final screen 16/16, 100%, name shown', async function () {
    await startAs('Amani Otieno');
    var seenPages = [];
    for (var p = 0; p < 4; p++) {
      seenPages.push(text('.page-head__title'));
      eq(text('.page-head__section').charAt(8), p < 2 ? 'A' : 'B', 'section letter on page ' + (p + 1));
      assert(text('.chip-name').indexOf('Amani Otieno') !== -1, 'name in top bar on page ' + (p + 1));
      playPage(4);
      eq(text('#result-title'), 'YEAHHH!! PERFECT SCORE! 🥳', 'page ' + (p + 1) + ' headline');
      $('.result > .btn').click();
    }
    eq(seenPages.length, 4, 'visited four pages');
    assert(seenPages[0].indexOf('Introduction to Programming') !== -1 && seenPages[1].indexOf('Computer Software Roadmap') !== -1 &&
           seenPages[2].indexOf('Python Fundamentals') !== -1 && seenPages[3].indexOf('Think Like a Programmer') !== -1, 'page titles in order: ' + seenPages.join(' | '));
    eq(win().document.body.getAttribute('data-view'), 'final', 'final view');
    eq(text('#final-title'), 'CONGRATULATIONS, AMANI OTIENO! 🎉', 'headline');
    eq(text('.final__sub'), "You've completed the Young Engineers Code Quest!", 'sub');
    await sleep(1500);
    var counts = $$('.final__stats .count').map(function (e) { return e.textContent; });
    eq(counts[0], '16', 'total score'); eq(counts[1], '100%', 'percentage');
    eq($$('.pagebars li').length, 4, 'four page bars');
    eq($$('.pagebars__score').map(function (e) { return e.textContent; }).join(','), '4/4,4/4,4/4,4/4', 'page scores');
    assert(text('.final__note').indexOf('not sent to your teacher yet') !== -1, 'honest note about results');
    assert(text('.final__message').indexOf('Amani') !== -1, 'personalised message');
    noHorizontalScroll('final');
  });

  test('mixed run (4,3,2,0) → 9/16 = 56% with correct per-page scores', async function () {
    await startAs('Zoë Müller');
    [4, 3, 2, 0].forEach(function (n) { playPage(n); $('.result > .btn').click(); });
    await sleep(1500);
    eq(text('#final-title'), 'CONGRATULATIONS, ZOË MÜLLER! 🎉', 'unicode name');
    var counts = $$('.final__stats .count').map(function (e) { return e.textContent; });
    eq(counts[0], '9', 'total'); eq(counts[1], '56%', 'percent');
    eq($$('.pagebars__score').map(function (e) { return e.textContent; }).join(','), '4/4,3/4,2/4,0/4', 'page scores');
  });

  test('all 16 questions load with 4 options, prompt and (where needed) code', async function () {
    await startAs('Test Kid');
    var seen = [];
    for (var p = 0; p < 4; p++) {
      for (var i = 0; i < 4; i++) {
        var q = currentQuestion();
        seen.push(q.id);
        eq($$('.opt').length, 4, q.id + ' options');
        eq($$('.opt .opt__text').map(function (e) { return e.textContent; }).join('|'), q.options.join('|'), q.id + ' option text');
        eq(!!$('pre.code'), !!q.code, q.id + ' code block');
        noHorizontalScroll(q.id);
        solve(); next();
      }
      $('.result > .btn').click();
    }
    eq(seen.length, 16, '16 questions'); eq(new Set(seen).size, 16, 'all unique');
  });

  test('progress survives a refresh (position, attempts, locked state)', async function () {
    await startAs('Refresh Kid');
    solve(); next();
    var q2 = currentQuestion();
    pick(wrongs(q2)[0]); check(); pick(wrongs(q2)[1]); check();
    await reload();
    eq(win().document.body.getAttribute('data-view'), 'quiz', 'still in quiz');
    assert(text('.chip-name').indexOf('Refresh Kid') !== -1, 'name kept');
    eq(text('.qcount'), 'Question 2 of 4', 'same question');
    eq(text('.tries > span:last-child'), 'Try 3 of 3', 'attempts kept (no free retries)');
    eq($$('.opt.is-tried').length, 2, 'tried options kept');
    assert(text('.fb').indexOf(q2.hints[1]) !== -1, 'hint kept');
    assert(doc().querySelector('.toast'), 'welcome back notice');
    pick(q2.answer); check(); next(); solve(); next(); solve(); next();
    eq($('.ring').getAttribute('aria-label'), 'Score: 4 out of 4', 'score correct after refresh');
  });

  test('refresh on a locked question keeps it locked; refresh on page result and final keeps them', async function () {
    await startAs('Refresh Kid');
    solve(); await reload();
    eq($$('.opt:not(:disabled)').length, 0, 'locked after refresh');
    next(); solve(); next(); solve(); next(); solve(); next();
    await reload();
    eq(win().document.body.getAttribute('data-view'), 'pageResult', 'page result persists');
    eq($('.ring').getAttribute('aria-label'), 'Score: 4 out of 4', 'page score persists');
    $('.result > .btn').click();
    for (var p = 1; p < 4; p++) { playPage(4); $('.result > .btn').click(); }
    await reload();
    eq(win().document.body.getAttribute('data-view'), 'final', 'final persists');
    assert(text('#final-title').indexOf('REFRESH KID') !== -1, 'name persists');
  });

  test('top-bar Restart works mid-quiz and clears saved progress', async function () {
    await startAs('Restart Kid');
    solve(); next();
    Array.prototype.filter.call($$('.topbar .btn'), function (b) { return b.textContent === 'Restart'; })[0].click();
    eq(win().document.body.getAttribute('data-view'), 'welcome', 'back on welcome');
    eq($('#student-name').value, '', 'name field empty (shared computers)');
    eq(win().sessionStorage.getItem('youngEngineers.codeQuest.phase1'), null, 'saved data removed');
    submitName('Someone Else');
    eq(text('.qcount'), 'Question 1 of 4', 'starts from question 1');
    eq(text('.tries > span:last-child'), 'Try 1 of 3', 'fresh attempts');
    assert(text('.chip-name').indexOf('Someone Else') !== -1, 'new name');
  });

  test('Restart keeps the quiz if the student cancels the confirmation', async function () {
    await startAs('Cancel Kid');
    solve(); next();
    win().confirm = function () { return false; };
    Array.prototype.filter.call($$('.topbar .btn'), function (b) { return b.textContent === 'Restart'; })[0].click();
    eq(win().document.body.getAttribute('data-view'), 'quiz', 'still in quiz');
    eq(text('.qcount'), 'Question 2 of 4', 'position kept');
  });

  test('Play again on the final screen restarts cleanly', async function () {
    await startAs('Replay Kid');
    for (var p = 0; p < 4; p++) { playPage(2); $('.result > .btn').click(); }
    var again = $$('.final__btns .btn')[0];
    eq(again.textContent, 'Play again 🔁', 'button label');
    again.click();
    eq(win().document.body.getAttribute('data-view'), 'welcome', 'welcome');
    submitName('Replay Kid');
    playPage(4);
    eq($('.ring').getAttribute('aria-label'), 'Score: 4 out of 4', 'previous run did not leak into the new score');
  });

  test('progress bar and steps update as the student advances', async function () {
    await startAs('Progress Kid');
    function fills() { return $$('.step__bar').map(function (e) { return e.getAttribute('aria-valuenow'); }).join(','); }
    eq(fills(), '0,0,0,0', 'start');
    solve(); next(); eq(fills(), '25,0,0,0', 'after 1');
    fail(); next(); eq(fills(), '50,0,0,0', 'after 2 (revealed counts as complete)');
    solve(); next(); solve(); next();
    eq(fills(), '100,0,0,0', 'after page 1');
    assert($$('.step')[0].classList.contains('is-done'), 'page 1 marked done');
    $('.result > .btn').click();
    assert($$('.step')[1].classList.contains('is-current'), 'page 2 current');
    eq($$('.step')[1].getAttribute('aria-current'), 'step', 'aria-current');
  });

  test('student names are never inserted as HTML', async function () {
    await fresh();
    var src = win().document.documentElement.outerHTML;
    assert(src.indexOf('onerror') === -1, 'no inline handlers in page');
    // The validator blocks markup; double-check by forcing a hostile value into storage
    win().sessionStorage.setItem('youngEngineers.codeQuest.phase1', JSON.stringify({ version: 1, view: 'quiz', name: '<img src=x onerror=alert(1)>', page: 0, qi: 0, q: {} }));
    await reload();
    eq(win().document.body.getAttribute('data-view'), 'welcome', 'tampered name rejected, back to welcome');
    eq($$('img').length, 0, 'no injected image');
  });

  test('every button on every screen does something (no dead buttons)', async function () {
    await fresh();
    eq($$('button').length, 1, 'welcome has exactly the Start button');
    submitName('Button Kid');
    $$('button').forEach(function (b) { assert(b.textContent.trim().length > 0 || b.getAttribute('aria-label'), 'unlabeled button'); });
    solve();
    var labels = $$('.actions .btn').map(function (b) { return b.textContent; });
    eq(labels.join(), 'Next Question →', 'only a working Next button after answering');
  });

  /* ───────────── runner ───────────── */
  (async function run() {
    log('Viewport width under test: ' + width + 'px\n');
    for (var i = 0; i < tests.length; i++) {
      var t = tests[i];
      try { await t.fn(); passed++; log('  ✔ ' + t.name); }
      catch (e) { failed++; log('  ✘ ' + t.name + '\n      → ' + e.message); }
    }
    var line = passed + ' passed, ' + failed + ' failed';
    summary.textContent = (failed ? '✘ ' : '✔ ') + line + ' (width ' + width + 'px)';
    summary.className = failed ? 'bad' : 'ok';
    log('\n' + line);
    document.title = 'DONE ' + (failed ? 'FAIL' : 'PASS') + ' ' + line;
  })();
})();
</script>
</body>
</html>
